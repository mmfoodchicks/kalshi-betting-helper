# Render blueprint. Deploy: push to GitHub, then New → Blueprint on render.com.
# Free sleeps when idle and has no disk; Starter and above are always-on. This
# tracks the live service, which runs on Standard (2 GB) -- see DEPLOY.md.
services:
  - type: web
    name: vigil
    runtime: docker
    plan: standard
    # Track the branch our work is pushed to, so every push auto-deploys and the
    # live site updates with nothing to do but refresh. Change this (or the
    # dashboard's Settings → Branch) if the work ever moves to main.
    branch: claude/kalshi-crypto-predictor-ckutwm
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random value
      - key: APP_PASSWORD
        sync: false                  # set your own in the dashboard to require login
      - key: TIERS_ENFORCED
        value: "0"
      # MORE THAN ONE WEB WORKER, and this is the setting that stops the
      # "HTTP health check failed (timed out after 5 seconds)" restarts.
      # When a request outlives gunicorn's --timeout the arbiter KILLS its
      # worker; with a single worker there is then nothing alive to answer
      # /healthz, the probe times out, and the platform restarts an instance
      # that was only ever busy. Measured on one CPU with every thread tied up
      # in long builds: 1 worker failed 7/7 probes, 2 workers failed 0/89.
      # Background jobs stay singular via a file lock (app._own_background_jobs).
      - key: WEB_CONCURRENCY
        value: "3"
      # With the disk below, point ALL THREE stores at it. Leaving any one at its
      # in-image default means it is thrown away on every restart and redeploy --
      # and the deep-sim run history is the one thing that cannot be recomputed.
      - key: KALSHI_DB
        value: /data/markets.db
      - key: PREDLOG_DB
        value: /data/predlog.db
      - key: DEEP_CACHE_DIR
        value: /data/deep
      # The error ledger (every failure point notes itself here with a stable
      # ID; /api/errors reads it, the error-log workflow commits it to the
      # sim-history branch). On the disk so a restart doesn't erase the trail.
      - key: ERRLOG_DB
        value: /data/errlog.db
      # NOTE: one more env var, SIM_TOKEN, is added by hand in the dashboard
      # (Environment tab), paired with a GitHub Actions secret of the same
      # value -- it authenticates the snapshot workflows once APP_PASSWORD is
      # set. It is deliberately NOT declared here: a Blueprint that introduces
      # a new sync:false variable stalls the deploy waiting for its value,
      # which failed a deploy for real. See DEPLOY.md.
    disk:                          # persistent storage (requires a paid plan)
      name: vigil-data
      mountPath: /data
      sizeGB: 1
    #
    # SIZING, MEASURED as peak PSS (what a cgroup limit enforces; summed RSS
    # double-counts the pages forked workers share and reads several times
    # higher): app idle 35 MB, +336 MB with one sim worker, +613 MB with two.
    # A web worker that has simulated a slate plateaus near 175 MB (fragmented
    # arenas no collection returns), which --max-requests recycling hands back.
    # Standard's 2 GB therefore carries 3 web workers (~525 MB worst case) plus
    # a deep-sim run, with room to spare; on Starter's 512 MB set
    # WEB_CONCURRENCY back to 1-2.
    # The app sizes its SIM pool from the cgroup CPU and memory limits rather
    # than the host core count; VIGIL_SIM_WORKERS overrides. See DEPLOY.md.
