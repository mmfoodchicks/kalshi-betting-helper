# Render blueprint. Deploy: push to GitHub, then New → Blueprint on render.com.
# Defaults to the FREE plan (zero cost) — note: free services sleep when idle
# (the background recorders pause) and have no persistent disk (the SQLite data
# resets on each deploy/restart). For 24/7 recording + persistence, switch to
# the Starter plan and uncomment the `disk:` block (see DEPLOY.md).
services:
  - type: web
    name: vigil
    runtime: docker
    plan: free
    # Track the branch our work is pushed to, so every push auto-deploys and the
    # live site updates with nothing to do but refresh. Change this (or the
    # dashboard's Settings → Branch) if the work ever moves to main.
    branch: claude/kalshi-crypto-predictor-ckutwm
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random value
      - key: APP_PASSWORD
        sync: false                  # set your own in the dashboard to require login
      - key: TIERS_ENFORCED
        value: "0"
      # - key: KALSHI_DB             # only with the disk below (Starter plan)
      #   value: /data/markets.db
    # disk:                          # persistent SQLite (requires a paid plan)
    #   name: vigil-data
    #   mountPath: /data
    #   sizeGB: 1
