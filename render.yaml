# Render blueprint. Deploy: push to GitHub, then New → Blueprint on render.com.
# Defaults to the FREE plan (zero cost) — note: free services sleep when idle
# (the background recorders pause) and have no persistent disk (the SQLite data
# resets on each deploy/restart). For 24/7 recording + persistence, switch to
# the Starter plan and uncomment the `disk:` block (see DEPLOY.md).
services:
  - type: web
    name: vigil
    runtime: docker
    plan: free
    # Track the branch our work is pushed to, so every push auto-deploys and the
    # live site updates with nothing to do but refresh. Change this (or the
    # dashboard's Settings → Branch) if the work ever moves to main.
    branch: claude/kalshi-crypto-predictor-ckutwm
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random value
      - key: APP_PASSWORD
        sync: false                  # set your own in the dashboard to require login
      - key: TIERS_ENFORCED
        value: "0"
      # With the disk below, point ALL THREE stores at it. Leaving any one at its
      # in-image default means it is thrown away on every restart and redeploy --
      # and the deep-sim run history is the one thing that cannot be recomputed.
      # - key: KALSHI_DB
      #   value: /data/markets.db
      # - key: PREDLOG_DB
      #   value: /data/predlog.db
      # - key: DEEP_CACHE_DIR
      #   value: /data/deep
    # disk:                          # persistent storage (requires a paid plan)
    #   name: vigil-data
    #   mountPath: /data
    #   sizeGB: 1
    #
    # SIZING, MEASURED as peak PSS (what a cgroup limit enforces; summed RSS
    # double-counts the pages forked workers share and reads several times
    # higher): app idle 35 MB, +336 MB with one sim worker, +613 MB with two.
    # So Starter's 512 MB is enough at ONE worker, and a 4,000-season run takes
    # about an hour -- fine for a job that runs at midnight.
    # The app sizes its own pool from the cgroup CPU and memory limits, so it
    # will pick 1 worker here rather than following the host core count off a
    # cliff; VIGIL_SIM_WORKERS overrides. See DEPLOY.md.
